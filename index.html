<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cardápio Digital — Espaço Delícia</title>
        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body>
        <header class="brand-header">
            <div class="brand-header__content">
                <img
                    class="brand-header__logo"
                    src="assets/images/logo/logo-espaco-delicia.webp"
                    alt="Logo da lanchonete"
                    width="160"
                    height="160"
                />
                <div class="brand-header__text">
                    <p class="brand-header__eyebrow">Cardápio digital</p>
                    <h1 id="business-name"></h1>
                    <button class="info-button" id="open-business-info" type="button">
                        Informações sobre a lanchonete
                    </button>
                </div>
            </div>
        </header>

        <nav class="category-nav" aria-label="Categorias do cardápio">
            <div class="category-nav__list" id="category-list"></div>
        </nav>

        <main class="menu" id="menu-content"></main>

        <dialog
            class="business-dialog"
            id="business-info"
            aria-labelledby="business-info-title"
        >
            <div class="business-dialog__panel">
                <div class="business-dialog__header">
                    <div>
                        <p class="business-dialog__eyebrow">Sobre nós</p>
                        <h2 id="business-info-title"></h2>
                    </div>
                    <button
                        class="close-button"
                        id="close-business-info"
                        type="button"
                        aria-label="Fechar informações da lanchonete"
                    >
                        Fechar
                    </button>
                </div>
                <div class="business-dialog__content" id="business-info-content"></div>
            </div>
        </dialog>

        <dialog
            class="product-dialog"
            id="product-details"
            aria-labelledby="product-details-title"
        >
            <div class="product-dialog__panel">
                <header class="product-dialog__header">
                    <button class="back-button" id="close-product-details" type="button">
                        Voltar
                    </button>
                </header>
                <div class="product-dialog__content" id="product-details-content"></div>
                <footer class="product-dialog__footer">
                    <button class="add-to-cart-button" id="add-to-cart" type="button">
                        <span id="product-action-label">Adicionar ao carrinho</span>
                        <span aria-hidden="true">•</span>
                        <span id="configured-total"></span>
                    </button>
                </footer>
            </div>
        </dialog>

        <dialog class="cart-dialog" id="cart-dialog" aria-labelledby="cart-title">
            <div class="cart-dialog__panel">
                <header class="cart-dialog__header">
                    <button class="back-button" id="close-cart" type="button">Voltar</button>
                    <h2 id="cart-title">Carrinho</h2>
                </header>
                <div class="cart-dialog__content" id="cart-content"></div>
                <footer class="cart-dialog__footer">
                    <div class="cart-summary" id="cart-summary"></div>
                    <div class="cart-dialog__actions">
                        <button class="secondary-button" id="continue-shopping" type="button">
                            Continuar escolhendo
                        </button>
                        <button class="checkout-button" id="start-checkout" type="button" disabled>
                            Fazer pedido
                        </button>
                    </div>
                </footer>
            </div>
        </dialog>

        <dialog class="checkout-dialog" id="checkout-dialog" aria-labelledby="checkout-title">
            <form class="checkout-dialog__panel" id="checkout-form" novalidate>
                <header class="checkout-dialog__header">
                    <button class="back-button" id="close-checkout" type="button">Voltar</button>
                    <h2 id="checkout-title">Finalizar pedido</h2>
                </header>

                <div class="checkout-dialog__content">
                    <fieldset
                        class="checkout-section fulfillment-choice"
                        id="checkout-fulfillment-group"
                        aria-describedby="checkout-fulfillment-error"
                    >
                        <legend>Como deseja receber?</legend>
                        <div class="fulfillment-choice__options">
                            <label class="fulfillment-option">
                                <input type="radio" name="fulfillment" value="pickup" />
                                <span>Retirada</span>
                            </label>
                            <label class="fulfillment-option">
                                <input type="radio" name="fulfillment" value="delivery" />
                                <span>Delivery</span>
                            </label>
                        </div>
                        <p class="field-error" id="checkout-fulfillment-error"></p>
                    </fieldset>

                    <section class="checkout-section" aria-labelledby="checkout-customer-title">
                        <h3 id="checkout-customer-title">Seus dados</h3>
                        <div class="checkout-fields">
                            <div class="field-group">
                                <label for="checkout-full-name">Nome completo</label>
                                <input
                                    id="checkout-full-name"
                                    name="fullName"
                                    type="text"
                                    maxlength="100"
                                    autocomplete="name"
                                    aria-describedby="checkout-full-name-error"
                                />
                                <p class="field-error" id="checkout-full-name-error"></p>
                            </div>
                            <div class="field-group">
                                <label for="checkout-phone">Telefone</label>
                                <input
                                    id="checkout-phone"
                                    name="phone"
                                    type="tel"
                                    inputmode="tel"
                                    maxlength="15"
                                    autocomplete="tel"
                                    placeholder="(00) 12345-6789"
                                    aria-describedby="checkout-phone-error"
                                />
                                <p class="field-error" id="checkout-phone-error"></p>
                            </div>
                        </div>
                    </section>

                    <section
                        class="checkout-section"
                        id="checkout-delivery-fields"
                        aria-labelledby="checkout-delivery-title"
                        hidden
                    >
                        <h3 id="checkout-delivery-title">Endereço de entrega</h3>
                        <div class="checkout-fields checkout-fields--address">
                            <div class="field-group field-group--wide">
                                <label for="checkout-street">Endereço</label>
                                <input
                                    id="checkout-street"
                                    name="street"
                                    type="text"
                                    maxlength="120"
                                    autocomplete="street-address"
                                    aria-describedby="checkout-street-error"
                                />
                                <p class="field-error" id="checkout-street-error"></p>
                            </div>
                            <div class="field-group">
                                <label for="checkout-number">Número</label>
                                <input
                                    id="checkout-number"
                                    name="number"
                                    type="text"
                                    maxlength="20"
                                    aria-describedby="checkout-number-error"
                                />
                                <p class="field-error" id="checkout-number-error"></p>
                            </div>
                            <div class="field-group">
                                <label for="checkout-neighborhood">Bairro</label>
                                <input
                                    id="checkout-neighborhood"
                                    name="neighborhood"
                                    type="text"
                                    maxlength="80"
                                    aria-describedby="checkout-neighborhood-error"
                                />
                                <p class="field-error" id="checkout-neighborhood-error"></p>
                            </div>
                            <div class="field-group field-group--wide">
                                <label for="checkout-complement">Complemento ou referência</label>
                                <span class="field-hint">Opcional</span>
                                <input
                                    id="checkout-complement"
                                    name="complement"
                                    type="text"
                                    maxlength="120"
                                    autocomplete="address-line2"
                                />
                            </div>
                        </div>
                    </section>

                    <section class="checkout-section checkout-summary" aria-labelledby="checkout-summary-title">
                        <h3 id="checkout-summary-title">Resumo do pedido</h3>
                        <dl>
                            <div>
                                <dt>Itens</dt>
                                <dd id="checkout-items"></dd>
                            </div>
                            <div>
                                <dt>Subtotal dos produtos</dt>
                                <dd id="checkout-products-total"></dd>
                            </div>
                            <div id="checkout-delivery-fee-row" hidden>
                                <dt>Taxa de entrega</dt>
                                <dd id="checkout-delivery-fee"></dd>
                            </div>
                            <div class="checkout-summary__total">
                                <dt>Total</dt>
                                <dd id="checkout-total"></dd>
                            </div>
                        </dl>
                    </section>
                </div>

                <footer class="checkout-dialog__footer">
                    <p class="checkout-status" id="checkout-status" role="status" aria-live="polite"></p>
                    <button class="checkout-continue-button" id="checkout-continue" type="submit">
                        Continuar
                    </button>
                </footer>
            </form>
        </dialog>

        <p class="storage-status" id="storage-status" role="status" aria-live="polite"></p>

        <aside class="cart-bar" id="cart-bar" hidden>
            <button class="cart-bar__button" id="open-cart" type="button">
                <span id="cart-bar-units"></span>
                <strong id="cart-bar-total"></strong>
                <span class="cart-bar__action">Ver carrinho</span>
            </button>
        </aside>

        <script type="module" src="assets/js/app.js"></script>
    </body>
</html>
